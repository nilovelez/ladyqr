name: Website

# Builds the public website (the landing page plus a live demo of the editor)
# and deploys it to GitHub Pages at https://ladyqr.nilovelez.com/.
#
# In the repository settings, Pages is set to use "GitHub Actions" as its
# source and ladyqr.nilovelez.com as its custom domain. With this kind of
# deployment no CNAME file is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the website
        run: |
          php --version
          php tools/build-site.php

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
